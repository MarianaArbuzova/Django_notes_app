{% extends 'base.html' %}

{% block title %}Створити нотатку{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 mb-4">Створити нотатку</h1>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.non_field_errors }}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-success mt-2">
                        Зберегти нотатку
                    </button>

                    <a href="{% url 'notes:index' %}" class="btn btn-outline-secondary mt-2 ms-2">
                        Скасувати
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
