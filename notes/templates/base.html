<!doctype html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="utf-8">
    <title>{% block title %}Мої нотатки{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- стилі -->
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container container-main">
        <a class="navbar-brand" href="{% url 'notes:index' %}">
            Notes App
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Перемикач навігації">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>

            <div class="d-flex">
                <a href="{% url 'notes:create_note' %}" class="btn btn-outline-light">
                    + Створити нотатку
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container container-main my-5">
    {% block content %}{% endblock %}
</main>

<footer class="text-center mt-auto mb-4 page-footer">
    &copy; 2025 Notes App
</footer>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
